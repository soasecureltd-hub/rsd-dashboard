name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches Dockerfile.backend
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"       # matches Dockerfile.frontend
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t rsd-backend:ci .
      - name: Migrations run and API starts in the image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DEBUG=True -e DATABASE_URL=sqlite:////tmp/rsd.db rsd-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend --build-arg VITE_API_URL=http://localhost:8000/api -t rsd-frontend:ci .

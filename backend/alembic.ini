[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os
# No sqlalchemy.url here on purpose: alembic/env.py uses the app's
# DATABASE_URL setting (environment / .env), so migrations always hit the same
# database the API uses.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
